name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configurar el entorno de Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Cachear dependencias de pip para acelerar ejecuciones futuras
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Ejecutar formateador Black (modo verificación)
      - name: Run Black formatter check
        run: |
          black --check app/ worker/ tests/

      # 6. Ejecutar Linter Flake8
      - name: Run Flake8 linter
        run: |
          # E9, F63, F7, F82 verifican errores de sintaxis y variables no definidas
          flake8 app/ worker/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de formato generales (max-line-length configurado a 120)
          flake8 app/ worker/ tests/ --count --max-line-length=120 --statistics

      # 7. Ejecutar Pruebas Automatizadas con Pytest
      - name: Run tests with pytest
        run: |
          python -m pytest tests/
